# Render Blueprint — тестовый бесплатный стек (Hobby/Free compute)
# Внешняя БД: Supabase (free Postgres). Не используйте Render Free Postgres (30 дней).
# Файлы uploads на Free не переживают redeploy.

services:
  - type: web
    name: crm-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: CRM
      - key: APP_URL
        value: https://crm-frontend-h3zf.onrender.com
      - key: API_URL
        value: https://crm-backend-myq6.onrender.com
      - key: TIMEZONE
        value: Europe/Minsk
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /data/uploads
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: LOG_LEVEL
        value: INFO
      - key: LOGIN_RATE_LIMIT_ENABLED
        value: "true"

  - type: web
    name: crm-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: API_URL
        value: https://crm-backend-myq6.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://crm-backend-myq6.onrender.com
